name: Idea for something new
description: A topic, a tool for the classroom, or a way to make a page better.
title: "Idea: "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What would you like, and who is it for (a student, a teacher, a parent)?
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: An example problem (optional)
      description: A problem you'd want it to handle, typed the way a student would.
