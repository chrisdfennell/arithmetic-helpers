name: Something's broken
description: A page doesn't load, a button doesn't work, it looks wrong, or it fails on a phone, printer or browser.
title: "Broken: "
labels: ["bug"]
body:
  - type: input
    id: link
    attributes:
      label: Link to the page
      description: The page's address (press "Copy link" if it has one).
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
      description: The steps to make it happen help a lot. A screenshot is great too (drag it in).
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: e.g. iPad, Safari · Windows laptop, Chrome · Chromebook
  - type: input
    id: version
    attributes:
      label: Version (optional)
      description: Shown in the home page footer and in the ? menu on every page.
      placeholder: e.g. 1.3.0
